<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PunePulse | Explore Pune</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.x/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@5.x/dist/maplibre-gl.js"></script>
</head>
<body>
    <header>
        <h1>🌿 PunePulse</h1>
        <p>Explore Pune's Heritage & Green Spaces</p>
    </header>

    <main>
        <section class="intro">
            <h2>Discover the Soul of Pune</h2>
            <p>Explore historic landmarks and beautiful gardens across Pune.</p>
        </section>

        <section class="map-section">
            <h2>Explore Pune on Map</h2>
            <div id="map"></div>
        </section>

        <section class="places">
            <h2>Explore Places</h2>
            <div class="filters">
                <input type="text" id="search-input" placeholder="Search Pune places...">
                <select id="category-filter">
                    <option value="All">All Places</option>
                    <option value="Heritage">Heritage</option>
                    <option value="Garden">Gardens</option>
                </select>
            </div>
            <p id="result-count">Showing 4 places</p>
            <div id="places-container"></div>
        </section>
    </main>

    <footer>
        <p>Made with ❤️ for Pune</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
